<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — OIStride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-logo"><img src="assets/img/logo.png" alt="OIStride"></a>
    <div class="nav-cta" style="margin-left:auto;">
      <a href="index.html" class="btn btn-outline btn-sm">← Back Home</a>
    </div>
  </div>
</nav>

<section class="section" style="padding-top:110px;">
  <div class="container" style="max-width:440px;">
    <div class="reveal">
      <span class="eyebrow" style="justify-content:center;">Reset Password</span>
      <h1 style="font-size:28px; text-align:center;">Choose a new password</h1>
      <p class="lead" style="font-size:15px; text-align:center; margin-top:12px;">You're almost done. Enter a new password below.</p>
    </div>
    <div class="form-card reveal" style="margin-top:32px;">
      <form id="reset-form">
        <div class="form-row"><label>New password</label><input type="password" name="password" autocomplete="new-password" minlength="6" required></div>
        <div class="auth-error" id="reset-error" hidden></div>
        <div class="auth-success" id="reset-success" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Set New Password</button>
      </form>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById('reset-form');
  const errorEl = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true; successEl.hidden = true;
    const btn = form.querySelector('button');
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Saving…';

    const { error } = await client.auth.updateUser({ password: form.password.value });

    btn.disabled = false; btn.textContent = original;

    if (error) {
      errorEl.textContent = error.message;
      errorEl.hidden = false;
      return;
    }
    successEl.textContent = 'Password updated. Redirecting you home…';
    successEl.hidden = false;
    form.reset();
    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
  });
</script>
</body>
</html>
