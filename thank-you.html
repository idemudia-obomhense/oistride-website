<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — OIStride Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-logo"><img src="assets/img/logo.png" alt="OIStride"></a>
    <div class="nav-cta" style="margin-left:auto;">
      <div data-auth-slot></div>
    </div>
  </div>
</nav>

<section class="section text-center" style="padding-top:110px;">
  <div class="container" style="max-width:520px;">
    <div class="reveal">
      <div style="width:64px; height:64px; border-radius:50%; background:var(--indigo-pale); color:var(--indigo); display:flex; align-items:center; justify-content:center; margin:0 auto 26px; font-size:28px; font-weight:800; font-family:var(--font-display);">✓</div>
      <h1 id="ty-heading" style="font-size:28px;">You're all set.</h1>
      <p id="ty-body" style="color:var(--grey); margin-top:14px; font-size:15.5px;">We've received your submission and Jed will follow up shortly.</p>
      <div class="hero-actions" style="justify-content:center; margin-top:32px;">
        <a href="index.html" class="btn btn-outline">Back to Home</a>
        <a href="book-a-call.html" class="btn btn-primary">Book a Free Consultation</a>
      </div>
    </div>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');
  const heading = document.getElementById('ty-heading');
  const body = document.getElementById('ty-body');
  const copy = {
    brochure: ["Your brochure is on its way.", "Check your inbox. We've sent the full PDF to the email you provided. Ready to take the next step? You can enroll anytime."],
    'brochure-pm': ["Your brochure is on its way.", "Check your inbox. We've sent the full PDF to the email you provided. Ready to take the next step? You can enroll anytime."],
    'brochure-aipm': ["Your brochure is on its way.", "Check your inbox. We've sent the full PDF to the email you provided. Ready to take the next step? You can enroll anytime."],
    payment: ["Payment successful, you're in.", "You've secured your seat. A confirmation email is on its way, along with your cohort community invite (WhatsApp/community group) within 24 hours."],
    call: ["Request received.", "Jed will confirm a time with you shortly by email or WhatsApp."]
  };
  if (type && copy[type]) { heading.textContent = copy[type][0]; body.textContent = copy[type][1]; }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
// Paystack redirects here with ?reference=... (and ?trxref=...) after the
// hosted checkout. The redirect itself proves nothing — a user could hit
// this URL by hand — so on ?type=payment we ask the server to confirm the
// charge actually succeeded (/api/paystack-verify) before showing a
// success message. The actual enrollment record is written by the webhook
// (api/paystack-webhook.js), which runs independently of this page; the
// markEnrollmentCompleted() call below is only a best-effort client-side
// UI sync so the account area doesn't look stale if the user lands here
// before the webhook has finished, not the source of truth.
(async function () {
  if (type !== 'payment') return;
  const reference = params.get('reference') || params.get('trxref');
  if (!reference) return;

  heading.textContent = "Confirming your payment…";
  body.textContent = "Hang tight while we confirm this with Paystack.";

  try {
    const res = await fetch(`/api/paystack-verify?reference=${encodeURIComponent(reference)}`);
    const data = await res.json();

    if (!res.ok || data.status !== 'success') {
      heading.textContent = "We couldn't confirm this payment yet.";
      body.textContent = "If you were charged, this can just be a brief delay. Check your email for a receipt, or contact us if it doesn't arrive shortly.";
      return;
    }

    const programLabel = data.programName ? ` for ${data.programName}` : "";
    heading.textContent = "Payment successful, you're in.";
    body.textContent = data.chargeType === 'deposit'
      ? `You've secured your seat${programLabel} with your 70% deposit. A confirmation email is on its way, along with your cohort community invite within 24 hours. The remaining 30% will be payable from your account before your second month starts.`
      : `You've secured your seat${programLabel}. A confirmation email is on its way, along with your cohort community invite (WhatsApp/community group) within 24 hours.`;

    if (data.programSlug && window.OIStrideAuth && typeof window.OIStrideAuth.markEnrollmentCompleted === 'function') {
      window.OIStrideAuth.markEnrollmentCompleted(data.programSlug).catch(() => {});
    }
  } catch (err) {
    console.error(err);
    heading.textContent = "We couldn't confirm this payment yet.";
    body.textContent = "If you were charged, this can just be a brief delay. Check your email for a receipt, or contact us if it doesn't arrive shortly.";
  }
})();
</script>
</body>
</html>
